name: Bump cask
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Point the cask at the latest Claude Pet release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/PieLord757/claude-pet/releases/latest -q .tag_name)
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/claude-pet.rb)
          if [ "$version" = "$current" ]; then echo "Already at $version"; exit 0; fi
          curl -fsSL -o ClaudePet.zip "https://github.com/PieLord757/claude-pet/releases/download/$tag/ClaudePet.zip"
          sha=$(sha256sum ClaudePet.zip | cut -d' ' -f1)
          sed -i "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/claude-pet.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-pet $version"
          git push
